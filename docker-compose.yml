services:
  postgres:
    image: postgres:18-alpine
    container_name: fsrs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fsrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsrs_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fsrs}
    volumes:
      # postgres:18+ 默认 PGDATA 是 /var/lib/postgresql/18/docker，卷要挂到父目录
      # （挂 /var/lib/postgresql/data 会触发 "unused mount/volume" 启动失败）
      - postgres_data:/var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fsrs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # GitHub Actions builds and pushes this image to Huawei Cloud SWR on every push to main.
    # Replace REGION/ORG to match your SWR (region ID + organization name).
    image: swr.cn-south-1.myhuaweicloud.com/smallar/fsrs-from-logseq-db:latest
    container_name: fsrs-app
    restart: unless-stopped
    volumes:
      # 应用日志写到 VPS 磁盘（/opt/fsrs/logs/app-YYYY-MM-DD.log），保留 14 天，容器重建不丢
      - ./logs:/app/logs
    logging:
      # docker logs 本身也轮转，防止 /var/lib/docker 无限膨胀
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fsrs}:${POSTGRES_PASSWORD:-fsrs_secret}@postgres:5432/${POSTGRES_DB:-fsrs}
      APP_PASSWORD: ${APP_PASSWORD:-change_me}
      SESSION_SECRET: ${SESSION_SECRET:-change_me}
    extra_hosts:
      # 网关 logseq-cli2http 以 systemd 服务跑在 VPS 宿主机上（默认 127.0.0.1:3000）。
      # 应用容器经 host.docker.internal 访问它——全局设置里填
      # http://host.docker.internal:3000（网关 HOST 需设为 0.0.0.0）
      - "host.docker.internal:host-gateway"
    ports:
      - "8790:8790"

volumes:
  postgres_data:
