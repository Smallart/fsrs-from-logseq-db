services:
  postgres:
    image: postgres:18-alpine
    container_name: fsrs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fsrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsrs_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fsrs}
    volumes:
      # postgres:18+ 默认 PGDATA 是 /var/lib/postgresql/18/docker，卷要挂到父目录
      # （挂 /var/lib/postgresql/data 会触发 "unused mount/volume" 启动失败）
      - postgres_data:/var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # 映射到宿主机，供 host 网络模式的 app 用 localhost:5432 访问
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fsrs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # GitHub Actions builds and pushes this image to Huawei Cloud SWR on every push to main.
    # Replace REGION/ORG to match your SWR (region ID + organization name).
    image: swr.cn-south-1.myhuaweicloud.com/smallar/fsrs-from-logseq-db:latest
    container_name: fsrs-app
    restart: unless-stopped
    # ★ 共享宿主机网络栈：容器内 localhost = VPS 宿主机。
    #   网关 logseq-cli2http 以 systemd 服务跑在宿主机上（绑定 127.0.0.1:3000），
    #   应用设置里网关 URL 填 http://localhost:3000 即可直达，无需改网关 HOST。
    network_mode: host
    volumes:
      # 应用日志写到 VPS 磁盘（/opt/fsrs/logs/app-YYYY-MM-DD.log），保留 14 天，容器重建不丢
      - ./logs:/app/logs
    logging:
      # docker logs 本身也轮转，防止 /var/lib/docker 无限膨胀
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # host 网络模式下没有 compose DNS，postgres 用 localhost:5432（不是 postgres）
      DATABASE_URL: postgresql://${POSTGRES_USER:-fsrs}:${POSTGRES_PASSWORD:-fsrs_secret}@localhost:5432/${POSTGRES_DB:-fsrs}
      APP_PASSWORD: ${APP_PASSWORD:-change_me}
      SESSION_SECRET: ${SESSION_SECRET:-change_me}
    # 无 ports：host 模式直接监听宿主机端口（应用跑在 8790）

volumes:
  postgres_data:
    name: fsrs_postgres_data
